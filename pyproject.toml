[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodroid"
version = "0.1.0"
description = "Android automation worker with persistent queue, CLI, and API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "croniter>=3.0,<4",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13,<14",
  "uiautomator2>=3.2,<4",
  "paddleocr>=2.8,<3",
  "paddlepaddle>=3.3.1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[project.scripts]
autodroid = "lib.entrypoints:cli_entrypoint"
autodroid-api = "lib.entrypoints:api_entrypoint"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]
